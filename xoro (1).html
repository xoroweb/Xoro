<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Sage</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231f1e1d'/%3E%3Cpath d='M50 12C80 30 82 68 50 90C18 68 20 30 50 12Z' fill='%23d97757'/%3E%3Cpath d='M55 28C38 38 62 54 46 76' fill='none' stroke='%231f1e1d' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
:root{--fs:16px;--bg:#faf9f5;--side:#f3f1ea;--card:#ece9e0;--pop:#ffffff;--text:#1f1e1d;--mute:#6f6c63;--acc:#c6613f;--onacc:#ffffff;--accbg:#f4e3da;--line:#e0ddd2;--grad:#faf9f5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1e1d;--side:#181817;--card:#2a2927;--pop:#262523;--text:#f3f1ec;--mute:#a3a097;--acc:#d97757;--onacc:#ffffff;--accbg:#3b2b24;--line:#383633;--grad:#1f1e1d}}
:root[data-theme="dark"]{--bg:#1f1e1d;--side:#181817;--card:#2a2927;--pop:#262523;--text:#f3f1ec;--mute:#a3a097;--acc:#d97757;--onacc:#ffffff;--accbg:#3b2b24;--line:#383633;--grad:#1f1e1d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:var(--fs)/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:var(--text)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lg{display:block}
.lg svg{width:100%;height:100%;display:block}
#app{height:100dvh;display:flex}
#side{background:var(--side);display:flex;flex-direction:column;padding:12px 10px;z-index:20;width:300px;max-width:88vw}
.sh{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 14px;font-family:"Source Serif 4",Georgia,serif;font-size:20px;font-weight:700}
.brand{display:flex;align-items:center;gap:10px}
.brand .lg{width:34px;height:34px}
.nav button{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:13px 14px;border-radius:24px;font-weight:600}
.nav button.hl{background:var(--card)}
.nav button:hover{background:var(--card)}
.tag{background:var(--accbg);color:var(--acc);border-radius:12px;padding:1px 9px;font-size:13px;font-weight:800}
#sq{display:none;margin:4px 4px 8px;width:calc(100% - 8px);height:44px;border-radius:22px;border:0;background:var(--card);padding:0 16px;outline:0}
.sec{color:var(--mute);padding:14px 14px 6px;font-size:13px;font-weight:800}
#list{flex:1;overflow-y:auto}
.it{display:flex;align-items:center;padding:8px 6px 8px 14px;border-radius:16px;cursor:pointer;gap:4px}
.it:hover,.it.on{background:var(--card)}
.it span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it button{color:var(--mute);padding:4px 10px;font-size:20px;font-weight:800}
.plan{width:100%;background:var(--acc);color:var(--onacc);border-radius:22px;padding:12px;font-weight:800;margin:8px 0}
.foot{display:flex;align-items:center;gap:10px;padding:4px 6px 2px}
.foot b{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#9a6b5a,#c0846d);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.ic:hover{background:var(--card)}
#wrap{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--grad);position:relative}
.top{display:flex;align-items:center;gap:8px;padding:10px 14px;flex-wrap:wrap}
.sp{flex:1}
#mbtn{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;border-radius:22px;font-size:17px;font-weight:700}
#mbtn:hover{background:var(--card)}
#mbtn b{font-weight:600;color:var(--mute)}
.dot{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:14px;background:var(--accbg);color:var(--text);flex:none}
#menu{display:none;position:absolute;left:14px;top:62px;width:min(380px,94vw);background:var(--pop);border:1px solid var(--line);border-radius:26px;padding:14px;z-index:30;box-shadow:0 16px 50px #0007}
#menu.open,#pm.open{display:block}
#ms{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px))}
#ms.open{display:flex}
.msc{width:min(640px,100%);max-height:86vh;overflow-y:auto;background:var(--pop);border:1px solid var(--line);border-radius:30px;padding:14px 14px 16px}
.mshd{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;margin-bottom:10px}
.mshd b{text-align:center;font-size:18px;font-weight:600}
.mshd button{width:44px;height:44px;border-radius:50%;font-size:22px}
.mi{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:16px 18px;border-radius:14px;background:var(--card);margin-bottom:8px}
.mi b{font-size:19px;font-weight:600}
.mi small{display:block;color:var(--mute);font-size:14.5px;margin-top:2px;font-weight:400}
.mi .ck{font-size:22px;color:var(--acc);font-weight:700}
.mhint{color:var(--mute);font-size:14px;margin:6px 6px 12px;line-height:1.45}
.mrow{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:18px;border-radius:14px;background:var(--card);font-size:18px;font-weight:600}
.mrow em{font-style:normal;color:var(--mute);font-weight:400}
.rc{font-style:normal;font-size:12px;background:var(--bg);border-radius:12px;padding:3px 10px;color:var(--mute);margin-left:8px;font-weight:600;vertical-align:middle}
.wc{font-style:normal;font-size:12px;background:#3a2a05;border-radius:12px;padding:3px 10px;color:#f5a524;margin-left:8px;font-weight:600;vertical-align:middle}
.mh{color:var(--mute);font-size:13px;font-weight:800;padding:0 4px 10px}
.mc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px;border-radius:20px;border:1.5px solid transparent;margin-bottom:6px;background:var(--card)}
.mc.on{border-color:var(--acc);background:var(--accbg)}
.mc .dot{width:44px;height:44px;border-radius:14px;font-size:21px}
.mc .tx{flex:1;min-width:0}
.mc .tx b{display:block;font-family:"Source Serif 4",Georgia,serif;font-weight:500;font-size:15px}
.mc .tx small{color:var(--mute);font-size:13px;line-height:1.3;display:block;margin-top:2px}
.mt{text-align:right;font-size:12px;font-weight:800;color:var(--mute)}
.bars{display:flex;gap:3px;justify-content:flex-end;margin-top:5px}
.bars i{width:5px;height:14px;border-radius:3px;background:var(--line)}
.bars i.f{background:var(--acc)}
.seg{display:flex;gap:4px;background:var(--card);border-radius:14px;padding:4px;margin-top:8px}
.seg button{flex:1;padding:9px 4px;border-radius:10px;font-weight:700;color:var(--mute);font-size:15px}
.seg button.on{background:var(--acc);color:var(--onacc)}
#pm{display:none;position:absolute;left:14px;bottom:calc(92px + env(safe-area-inset-bottom,0px));min-width:250px;background:var(--pop);border:1px solid var(--line);border-radius:26px;padding:8px;z-index:30;box-shadow:0 14px 44px #000a}
#pm button{display:flex;gap:16px;align-items:center;width:100%;text-align:left;padding:15px 16px;border-radius:14px;font-weight:600;font-size:17px}
#pm button:hover{background:var(--card)}
#vo{position:fixed;inset:0;z-index:70;background:#000;color:#f5f5f5;display:none;flex-direction:column;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 20px calc(26px + env(safe-area-inset-bottom,0px))}
#vo.open{display:flex}
#vo .ic{color:#f5f5f5}
.vt{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:520px}
#vst{font-family:"Source Serif 4",Georgia,serif;font-size:15px;color:#c8c8cc;text-align:center}
#vorb{--bg:#0c0c0e;margin:auto;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2a2a2e,#0c0c0e);border:1px solid #2c2c30;display:grid;place-items:center;color:#f5f5f5}
#vorb .lg{width:100px;height:100px}
#vo[data-s="listen"] #vorb{animation:br 2.4s ease-in-out infinite}
#vo[data-s="think"] #vorb .lg{animation:sp 2.4s linear infinite}
#vo[data-s="speak"] #vorb{animation:sk .9s ease-in-out infinite}
@keyframes br{0%,100%{box-shadow:0 0 0 0 #ffffff22;transform:scale(1)}50%{box-shadow:0 0 0 26px #ffffff08;transform:scale(1.04)}}
@keyframes sk{0%,100%{box-shadow:0 0 0 6px #ffffff18;transform:scale(1)}50%{box-shadow:0 0 0 34px #ffffff0a;transform:scale(1.08)}}
#vtx{min-height:52px;max-width:520px;text-align:center;color:#e8e8ea;margin:0 0 8px;font-size:17px}
#vhint{color:#7c7c82;font-size:13px;margin:0;text-align:center}
.ty .lg{color:var(--text)}
.gi{max-width:420px;border-radius:20px;overflow:hidden}
.tw{overflow-x:auto;margin:8px 0}
.msg table{border-collapse:collapse;min-width:100%}
.msg th,.msg td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.msg th{background:var(--card)}
#tabs{display:flex;gap:4px;background:var(--card);border-radius:16px;padding:4px}
#tabs button{padding:8px 18px;border-radius:12px;color:var(--mute);font-family:"Source Serif 4",Georgia,serif;font-size:13px;font-weight:500}
#tabs button.on{background:var(--bg);color:var(--text)}
#main{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
button{touch-action:manipulation}
#main,#imgp,#bldp{flex:1;overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column;width:100%;max-width:820px;margin:0 auto}
#imgp,#bldp{display:none}
.empty{margin:auto;text-align:center}
.empty .lg{width:84px;height:84px;margin:0 auto}
.empty h1{font-family:"Source Serif 4",Georgia,serif;font-weight:500;font-size:clamp(24px,4.2vw,38px);margin:14px 0 0;letter-spacing:-.5px}
.empty p{color:var(--mute);margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:26px}
.chips button{background:var(--card);border-radius:14px;padding:12px 16px;font-weight:600;font-size:15px}
.msg{max-width:88%;margin:8px 0;padding:11px 16px;border-radius:20px;word-wrap:break-word;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--card);white-space:pre-wrap}
.msg.u img{display:block;max-width:180px;max-height:180px;border-radius:14px;margin-bottom:8px}
.msg.a{align-self:flex-start;padding-left:0;max-width:100%}
.msg.a.er{color:#ff8a8a}
.msg ul,.msg ol{margin:6px 0;padding-left:22px}
.msg pre{background:var(--card);padding:12px;border-radius:14px;overflow-x:auto;margin:8px 0}
.msg code{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:var(--card);padding:1px 6px;border-radius:6px}
.msg pre code{background:none;padding:0}
.msg h4{margin:10px 0 4px;font-size:1.05em}
.msg a{color:var(--text);text-decoration:underline}
.msg .l{min-height:1em}
.acts{display:flex;gap:4px;margin-top:4px;margin-left:-8px}
.acts button{color:var(--mute);padding:8px 10px;border-radius:12px}
.acts button:active{background:var(--card)}
.acts .i{width:20px;height:20px}
.ty{display:flex;align-items:center;gap:10px;font-weight:700}
.ty .lg{width:30px;height:30px;animation:sp 2.4s linear infinite,pl 1.4s ease-in-out infinite}
.ty span{background:linear-gradient(90deg,var(--mute) 30%,var(--text) 50%,var(--mute) 70%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 1.6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pl{0%,100%{opacity:.55;scale:.85}50%{opacity:1;scale:1.12}}
@keyframes sh{to{background-position:-200% 0}}
#attach{width:calc(100% - 20px);max-width:780px;margin:0 auto}
.chip2{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:16px;padding:6px 8px;margin-bottom:6px}
.chip2 img{width:52px;height:52px;border-radius:10px;object-fit:cover}
.chip2 button{padding:6px 10px;font-weight:800;color:var(--mute)}
.dock{width:calc(100% - 20px);max-width:780px;margin:6px auto 14px;background:var(--card);border-radius:22px;padding:8px 12px 8px;display:flex;flex-direction:column;align-items:stretch;gap:2px}
.dkb{display:flex;align-items:center;gap:8px}
.mpill{display:flex;align-items:center;gap:7px;height:40px;padding:0 14px;border-radius:14px;background:var(--bg);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;min-width:0}
.mpill span{color:var(--mute);font-weight:600}
textarea{flex:none;width:100%;border:0;outline:0;resize:none;background:none;font-size:18px;max-height:160px;padding:8px 6px}
.go{width:48px;height:48px;border-radius:16px;background:var(--acc);color:var(--onacc);display:grid;place-items:center;flex:none}
.go:disabled{opacity:.5}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.opts button{background:var(--card);border-radius:16px;padding:8px 14px;font-weight:700;font-size:14px;color:var(--mute)}
.opts button.on{background:var(--acc);color:#fff}
.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin:6px 0 14px}
.ic2{border-radius:20px;overflow:hidden;background:var(--card)}
.ph{position:relative;background:linear-gradient(110deg,var(--card) 30%,var(--line) 50%,var(--card) 70%);background-size:200% 100%;animation:sh 1.6s linear infinite}
.ph.ok{animation:none;background:none}
.ph img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.ph.ok img{opacity:1}
.ph.bad::after{content:"Картинка не сохранилась после перезагрузки";position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:14px;color:var(--mute);font-size:14px}
.ic2 span{display:block;padding:10px 12px 4px;font-size:14px;color:var(--mute)}
.ia{display:flex;gap:4px;padding:2px 6px 8px}
.ia button{padding:6px 10px;font-size:13px;font-weight:700;color:var(--acc)}
.note{color:var(--mute);font-size:14px;text-align:center;margin:auto;max-width:420px}
.bcard{background:var(--card);border-radius:22px;padding:12px;margin:8px 0}
.bcard iframe{width:100%;height:440px;border:0;border-radius:14px;background:#fff}
.bcard .ia{padding:8px 0 0}
#shade{position:fixed;inset:0;background:#0007;z-index:15;display:none}
#mod{position:fixed;inset:0;background:#000a;z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
#mod.open{display:flex}
.card{background:var(--pop);border:1px solid var(--line);border-radius:28px;padding:22px;width:min(460px,100%);max-height:92vh;overflow-y:auto}
.card h3{font-family:"Source Serif 4",Georgia,serif;font-weight:500;margin:0 0 6px}
.card label{display:block;color:var(--mute);font-size:13px;font-weight:800;margin:14px 0 6px}
.card input,.card textarea{width:100%;border-radius:16px;border:0;background:var(--card);padding:0 14px;outline:0;height:46px;font-size:16px}
.card textarea{height:92px;padding:12px 14px;resize:none}
.card p{color:var(--mute);font-size:14px;margin:6px 0}
.btn{width:100%;padding:13px;border-radius:14px;background:var(--acc);color:var(--onacc);font-weight:800;margin-top:16px}
.btn.g{background:var(--card);color:var(--text);margin-top:8px}
.btn.r{color:#ff6b6b}
#auth{position:fixed;inset:0;z-index:80;background:var(--grad);background-color:var(--bg);display:none;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
#auth.open{display:flex}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:20px;font-weight:700;z-index:90;display:none;max-width:90vw;text-align:center}
@media(min-width:800px){#side{flex:none;transition:margin .25s}#app.collapsed #side{margin-left:-300px}#app:not(.collapsed) #burger{display:none}}
@media(max-width:799px){#side{position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%);transition:transform .25s;padding-top:calc(12px + env(safe-area-inset-top,0px))}#side.open{transform:none}#shade.open{display:block}#tabs{order:5;width:100%;justify-content:center}}
.msg.a{font-family:"Source Serif 4",Georgia,serif;font-size:1.07em;line-height:1.7}
.msg.a pre,.msg.a code{font-family:ui-monospace,Menlo,monospace}
.mth[data-d="1"]{display:block;margin:10px 0;overflow-x:auto;overflow-y:hidden}
.katex{font-size:1.08em}
</style>
</head>
<body>
<div id="app">
<aside id="side">
 <div class="sh"><span class="brand"><i class="lg" data-logo></i>Sage</span><button class="ic" id="fold" aria-label="Свернуть"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 4v16"/></svg></button></div>
 <div class="nav">
  <button class="hl" id="new"><svg class="i" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>Новый чат</button>
  <button id="srch"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>Поиск по чатам</button>
  <input id="sq" placeholder="Введите запрос">
  <button data-soon><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Автоматизации</button>
  <button data-soon><svg class="i" viewBox="0 0 24 24"><path d="M3 7h18v13H3zM7 7V4h10v3"/></svg>Библиотека</button>
  <button data-soon><svg class="i" viewBox="0 0 24 24"><path d="M3 6h7l2 2h9v11H3z"/></svg>Проекты</button>
  <button data-soon><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 10v1M15 10v1M9 15c2 1.5 4 1.5 6 0"/></svg>Sage Bot <span class="tag">Новый</span></button>
 </div>
 <div id="list"></div>
 <button class="plan" data-soon>Сменить план</button>
 <div class="foot"><div class="av" id="av1"></div><b id="nm"></b><button class="ic" id="gear" aria-label="Настройки"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button></div>
</aside>
<section id="wrap">
 <div class="top">
  <button class="ic" id="burger" aria-label="Меню"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
  <span class="sp"></span>

 $("auth").classList.add("open");
}
function doAuth(){
 var em=$("a_em").value.trim().toLowerCase(),pw=$("a_pw").value,er=$("a_err");
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){er.textContent="Введите корректную почту";return}
 if(pw.length<6){er.textContent="Пароль должен быть не короче 6 символов";return}
 var us={};try{us=JSON.parse(ls("xoro_users")||"{}")}catch(x){}
 sha(em+":"+pw).then(function(h){
  if(authMode==="reg"){if(us[em]){er.textContent="Такой аккаунт уже есть, откройте вкладку «Вход»";return}us[em]={h:h};ls("xoro_users",JSON.stringify(us))}
  else{if(!us[em]){er.textContent="Аккаунт не найден. Сначала зарегистрируйтесь";return}if(us[em].h!==h){er.textContent="Неверный пароль";return}}
  ls("xoro_session",em);$("auth").classList.remove("open");start(em);
 });
}
